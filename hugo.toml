baseURL = "https://example.github.io/"
title = "Shiori Route"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = false

[pagination]
  pagerSize = 8

[outputs]
  home = ["HTML", "RSS"]

[params]
  author = "Jingke"
  description = "Notes on technology, craft, and everyday life."

[languages]
  [languages.zh]
    languageCode = "zh-CN"
    languageName = "中文"
    title = "Shiori Route"
    weight = 2
    [languages.zh.params]
      description = "关于技术、创造与生活的双语笔记"
    [[languages.zh.menus.main]]
      name = "Start"
      pageRef = "/"
      weight = 10
    [[languages.zh.menus.main]]
      name = "Bookmarks"
      pageRef = "/bookmarks"
      weight = 20
    [[languages.zh.menus.main]]
      name = "Paper Radar"
      pageRef = "/papers"
      weight = 30
    [[languages.zh.menus.main]]
      name = "About"
      pageRef = "/about"
      weight = 40
    [[languages.zh.menus.main]]
      name = "Side Quests"
      pageRef = "/side-quests"
      weight = 50
    [[languages.zh.menus.main]]
      name = "Marginalia"
      pageRef = "/marginalia"
      weight = 60

  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    title = "Shiori Route"
    weight = 1
    [languages.en.params]
      description = "Bilingual notes on technology, craft, and life"
    [[languages.en.menus.main]]
      name = "Start"
      pageRef = "/"
      weight = 10
    [[languages.en.menus.main]]
      name = "Bookmarks"
      pageRef = "/bookmarks"
      weight = 20
    [[languages.en.menus.main]]
      name = "Paper Radar"
      pageRef = "/papers"
      weight = 30
    [[languages.en.menus.main]]
      name = "About"
      pageRef = "/about"
      weight = 40
    [[languages.en.menus.main]]
      name = "Side Quests"
      pageRef = "/side-quests"
      weight = 50
    [[languages.en.menus.main]]
      name = "Marginalia"
      pageRef = "/marginalia"
      weight = 60

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = false

name: Daily paper radar

on:
  schedule:
    # 21:17 UTC = 06:17 JST the following day. Avoids the busy top of the hour.
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-radar
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

      - name: Generate paper radar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python scripts/paper_radar.py --analyze

      - name: Validate Hugo site
        run: >
          docker run --rm
          -v "${{ github.workspace }}:/src"
          -w /src
          hugomods/hugo:exts-0.148.2
          hugo --gc --minify

      - name: Commit generated content
        id: commit
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- content/papers static/data/paper-radar static/paper-radar.xml data/processed_papers.json)" ]]; then
            echo "No generated changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content/papers static data/processed_papers.json
          git commit -m "content: update daily paper radar"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        run: git push origin HEAD:main

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yaml
